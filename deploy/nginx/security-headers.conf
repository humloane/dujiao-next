# 在 serving shop.neaixt.com 的 server {} 块内 include 本文件。
# 生成 WebP 变体后，前端 srcset 会自动使用 -480/-800/-1200/-1800.webp。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP 先 Report-Only：确认 Chatwoot、支付网关、图片域名后再改为 Content-Security-Policy 强制。
# 根据实际嵌入域名调整 script-src / connect-src / frame-src。
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; frame-src 'self' https:; font-src 'self' data:" always;
